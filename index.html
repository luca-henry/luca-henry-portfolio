<!-- 1) CUSTOM CURSOR -->
<style>
@media (hover:hover) and (pointer:fine){
  html.cc-on,html.cc-on *{cursor:none!important}
  #cc{position:fixed;top:0;left:0;pointer-events:none;z-index:2147483647;opacity:0;transition:opacity .15s,scale .18s cubic-bezier(.2,.8,.2,1);will-change:transform,scale}
  #cc.v{opacity:1}
  #cc img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;pointer-events:none;-webkit-user-drag:none}
  #cc[data-s=pointer] .pointer,#cc[data-s=hover] .hover,#cc[data-s=grab] .grab,#cc[data-s=finger] .finger{opacity:1}
}
</style>

<script>
(function () {
  'use strict';
  if (window.__cc || !matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  window.__cc = 1;

  /* ---------- settings ---------- */
  const SIZE = 45;
  const HOT_X = 0.5, HOT_Y = 0.5;
  const STATE_SCALE = {
    pointer: 1,
    hover:   1,
    grab:    1,
    finger:  1
  };
  // Change cursor size live with window.setCursorSize(60). Reset with window.setCursorSize().
  const IMG = {
    pointer: 'https://i-p.rmcdn.net/6a0683c1b3e3fb5f40151b21/6601011/image-ba353ff5-d379-4367-afa8-66f3390d674f.png',
    hover:   'https://i-p.rmcdn.net/6a0683c1b3e3fb5f40151b21/6601011/image-630ac91b-4a03-4ca1-b23d-dcb44c1d5b0e.png',
    grab:    'https://i-p.rmcdn.net/6a0683c1b3e3fb5f40151b21/6601011/image-67d36909-8a76-4806-9536-5625c558493a.png',
    finger:  'https://i-p.rmcdn.net/6a0683c1b3e3fb5f40151b21/6601011/image-ba353ff5-d379-4367-afa8-66f3390d674f.png'
  };
  const CLICKABLE = 'a,button,input,select,textarea,label,summary,[role=button],[role=link],[onclick]';
  const MEDIA = 'img,picture,figure,video,canvas,[class*=image i],[class*=media i],[class*=video i]';
  /* ------------------------------- */

  const root = document.documentElement;
  const el = document.createElement('div');
  el.id = 'cc';
  el.dataset.s = 'pointer';
  el.style.width = el.style.height = SIZE + 'px';
  const ox = SIZE * HOT_X, oy = SIZE * HOT_Y;
  el.style.transformOrigin = ox + 'px ' + oy + 'px';

  let userScale = 1;
  const applyScale = () => { el.style.scale = (STATE_SCALE[state] || 1) * userScale; };
  window.setCursorSize = px => { userScale = px > 0 ? px / SIZE : 1; applyScale(); };

  Object.keys(IMG).forEach(k => {
    const i = new Image();
    i.className = k; i.alt = ''; i.decoding = 'async'; i.draggable = false;
    if (k === 'pointer') i.onload = () => root.classList.add('cc-on');
    i.src = IMG[k];
    el.appendChild(i);
  });

  const mount = () => document.body.appendChild(el);
  document.body ? mount() : addEventListener('DOMContentLoaded', mount, { once: true });

  let x = 0, y = 0, state = 'pointer', target = null, down = false;
  let mode = 'local', remote = 'pointer', queued = false, rescan = false;
  const frames = new WeakMap(), greeted = new WeakSet();

  const place = () => { el.style.transform = 'translate3d(' + (x - ox) + 'px,' + (y - oy) + 'px,0)'; };
  const vis = v => el.classList.toggle('v', v);
  const queue = () => { if (!queued) { queued = true; requestAnimationFrame(update); } };

  function stateOf(t) {
    if (down) return 'grab';
    if (!t || t.nodeType !== 1) return 'pointer';
    const o = t.closest('[data-cursor]');
    if (o) { const v = o.dataset.cursor; if (IMG[v]) return v === 'grab' && !down ? 'hover' : v; }
    const media = t.closest(MEDIA);
    if (down && media) return 'grab';
    if (t.closest(CLICKABLE)) return 'finger';
    return media ? 'hover' : 'pointer';
  }

  function update() {
    queued = false;
    if (rescan) {
      rescan = false;
      if (mode === 'local') { const t = document.elementFromPoint(x, y); if (t && t.tagName !== 'IFRAME') target = t; }
    }
    const n = mode === 'remote' ? remote : stateOf(target);
    if (n !== state) { state = n; el.dataset.s = n; applyScale(); }
  }

  const opt = { capture: true, passive: true };
  addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;
    mode = 'local'; x = e.clientX; y = e.clientY; target = e.target; down = e.buttons > 0;
    place(); vis(true); queue();
  }, opt);
  addEventListener('pointerdown', e => { if (e.pointerType !== 'touch') { down = true; target = e.target; queue(); } }, opt);
  ['pointerup', 'pointercancel', 'blur', 'dragend'].forEach(t => addEventListener(t, () => { down = false; queue(); }, opt));
  addEventListener('scroll', () => { rescan = true; queue(); }, opt);
  root.addEventListener('pointerleave', () => vis(false));

  // Code widgets (iframes) report their own mouse position and state.
  addEventListener('message', e => {
    const d = e.data;
    if (!d || d.type !== 'cursor-sync') return;
    if (!greeted.has(e.source)) {
      greeted.add(e.source);
      try { e.source.postMessage({ type: 'cursor-ready' }, '*'); } catch (_) {}
    }
    if (d.hide) { vis(false); return; }
    let f = frames.get(e.source);
    if (!f || !f.isConnected) {
      f = null;
      for (const fr of document.getElementsByTagName('iframe')) if (fr.contentWindow === e.source) { f = fr; break; }
      if (f) frames.set(e.source, f);
    }
    if (f) {
      const r = f.getBoundingClientRect();
      x = r.left + d.x * (f.clientWidth ? r.width / f.clientWidth : 1);
      y = r.top + d.y * (f.clientHeight ? r.height / f.clientHeight : 1);
    } else { x = d.x; y = d.y; }
    mode = 'remote'; remote = IMG[d.state] ? d.state : 'pointer';
    place(); vis(true); queue();
  });
})();
</script>

<!-- 2) PULL-CORD LIGHT SWITCH -->
<style>
html.cc-dark { filter: invert(1) hue-rotate(180deg); }
html.cc-dark :is(img, video, [style*="background-image"]):not(#cc *):not(#ls *) { filter: invert(1) hue-rotate(180deg); }

#ls { position: fixed; top: 0; left: 0; z-index: 2147483000; pointer-events: none; user-select: none; -webkit-user-select: none; }
#ls canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#ls-h { position: absolute; left: 0; top: 0; box-sizing: border-box; width: 20px; height: 40px; margin: 0 0 0 -10px; padding: 0;
        background: var(--ls-paper); border: 4px solid var(--ls-ink); border-radius: 7px 7px 11px 11px;
        box-shadow: -3px 3px 0 var(--ls-ink);
        cursor: grab; pointer-events: auto; touch-action: none; transform-origin: 50% 0; will-change: transform; -webkit-tap-highlight-color: transparent; }
#ls-h:active { cursor: grabbing; }
#ls-h::before { content: ''; position: absolute; inset: -12px -18px; }
#ls-h:focus-visible { outline: 2px solid #4d90ff; outline-offset: 6px; }
</style>

<script>
(function () {
  'use strict';
  if (window.__ls) return;
  window.__ls = 1;

  /* ---------- settings ---------- */
  const POS_X = 0.75;
  const LENGTH = 70;
  const CHAIN = true;
  const INK = '#231f20';
  const PAPER = '#f5f7f6';
  const TRIGGER = 50;
  const MAX_PULL = 65;
  const GRAVITY = 0.4;
  const DAMPING = 0.992;
  const SEGMENTS = 12;
  const STORE = 'cc-dark';
  /* ------------------------------- */

  const root = document.documentElement;
  let dark = false;
  try { dark = localStorage.getItem(STORE) === '1'; } catch (_) {}
  root.classList.toggle('cc-dark', dark);

  const R = LENGTH + MAX_PULL, N = SEGMENTS, W = Math.ceil(2 * R + 60), H = Math.ceil(R + 60);
  const VMAX = 22, FOLLOW = 30;
  const ax = W / 2, ay = -6;
  const pts = [];
  for (let i = 0; i <= N; i++) { const y = ay + LENGTH * i / N; pts.push({ x: ax, y: y, px: ax, py: y }); }

  let box, cv, cx, h, dpr = 1;
  let stretch = 0, stretchT = 0, pull = 0, ex = ax, ey = ay + LENGTH;
  let drag = false, fired = false, didFire = false, moved = 0, sx = 0, sy = 0, t0 = 0, offX = 0, offY = 0, bx = 0, by = 0;
  let raf = 0, last = 0, acc = 0;

  function mount() {
    box = document.createElement('div'); box.id = 'ls';
    box.style.width = W + 'px'; box.style.height = H + 'px';
    cv = document.createElement('canvas'); box.appendChild(cv);
    h = document.createElement('button');
    h.id = 'ls-h'; h.type = 'button'; h.setAttribute('data-cursor', 'grab');
    h.setAttribute('aria-label', 'Toggle dark mode');
    box.style.setProperty('--ls-ink', INK); box.style.setProperty('--ls-paper', PAPER);
    box.appendChild(h);
    document.body.appendChild(box);
    cx = cv.getContext('2d');
    paint(); resize(); draw();
    pts[N].px -= 1.4; start();
    addEventListener('resize', resize);
    bind();
  }
  document.body ? mount() : addEventListener('DOMContentLoaded', mount, { once: true });

  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr;
    box.style.left = Math.round(innerWidth * POS_X - W / 2) + 'px';
    draw();
  }

  // ---------- mode ----------
  function paint() { h.setAttribute('aria-pressed', dark); }
  function broadcast() {
    for (const f of document.getElementsByTagName('iframe')) { try { f.contentWindow.postMessage({ type: 'cc-theme', dark: dark }, '*'); } catch (_) {} }
  }
  function toggle() {
    dark = !dark;
    root.classList.toggle('cc-dark', dark);
    paint(); broadcast();
    try { localStorage.setItem(STORE, dark ? '1' : '0'); } catch (_) {}
    dispatchEvent(new CustomEvent('cc-theme', { detail: { dark: dark } }));
  }
  addEventListener('load', broadcast);
  addEventListener('message', e => {
    if (e.data && e.data.type === 'cc-hello') { try { e.source.postMessage({ type: 'cc-theme', dark: dark }, '*'); } catch (_) {} }
  });

  // ---------- physics (Verlet rope, only runs while moving) ----------
  function step() {
    const len = (LENGTH + stretch) / N;
    for (let i = 1; i <= N; i++) {
      if (drag && i === N) continue;
      const p = pts[i];
      let vx = (p.x - p.px) * DAMPING, vy = (p.y - p.py) * DAMPING;
      const v = Math.hypot(vx, vy);
      if (v > VMAX) { vx *= VMAX / v; vy *= VMAX / v; }
      p.px = p.x; p.py = p.y; p.x += vx; p.y += vy + GRAVITY;
    }
    if (drag) {
      stretch += (stretchT - stretch) * .5;
      const p = pts[N]; let dx = ex - p.x, dy = ey - p.y; const d = Math.hypot(dx, dy);
      if (d > FOLLOW) { dx *= FOLLOW / d; dy *= FOLLOW / d; }
      p.px = p.x; p.py = p.y; p.x += dx; p.y += dy;
    } else stretch = stretch > .05 ? stretch * .82 : 0;
    for (let k = 0; k < 16; k++) {
      pts[0].x = ax; pts[0].y = ay;
      for (let i = 0; i < N; i++) {
        const a = pts[i], b = pts[i + 1], ia = i ? 1 : 0, ib = drag && i + 1 === N ? 0 : 1, s = ia + ib;
        if (!s) continue;
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-4, f = (d - len) / d;
        a.x += dx * f * ia / s; a.y += dy * f * ia / s; b.x -= dx * f * ib / s; b.y -= dy * f * ib / s;
      }
    }
    let bad = false;
    for (let i = 1; i <= N; i++) {
      const p = pts[i];
      if (p.y < ay + 2) p.y = ay + 2;
      if (!isFinite(p.x + p.y)) bad = true;
    }
    if (bad) reset();
  }
  function reset() {
    for (let i = 0; i <= N; i++) { const y = ay + LENGTH * i / N, p = pts[i]; p.x = p.px = ax; p.y = p.py = y; }
    stretch = 0; stretchT = 0;
  }
  const energy = () => { let s = 0; for (let i = 1; i <= N; i++) { const p = pts[i]; s += Math.abs(p.x - p.px) + Math.abs(p.y - p.py); } return s; };
  const STEP = 1000 / 60;
  function frame(now) {
    raf = 0; acc += Math.min(64, now - last); last = now;
    while (acc >= STEP) { step(); acc -= STEP; }
    draw();
    if (drag || stretch > 0 || energy() > .15) raf = requestAnimationFrame(frame);
  }
  function start() { if (!raf) { last = performance.now(); acc = 0; raf = requestAnimationFrame(frame); } }

  function draw() {
    if (!cx) return;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, W, H);
    const path = new Path2D();
    path.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < N; i++) { const a = pts[i], b = pts[i + 1]; path.quadraticCurveTo(a.x, a.y, (a.x + b.x) / 2, (a.y + b.y) / 2); }
    path.lineTo(pts[N].x, pts[N].y);
    cx.lineCap = 'round'; cx.lineJoin = 'round';
    cx.setLineDash(CHAIN ? [0, 8] : []);
    cx.strokeStyle = INK;   cx.lineWidth = CHAIN ? 10 : 7;   cx.stroke(path);
    cx.strokeStyle = PAPER; cx.lineWidth = CHAIN ? 5.4 : 3;  cx.stroke(path);
    const e = pts[N], p = pts[N - 1];
    h.style.transform = 'translate(' + e.x + 'px,' + e.y + 'px) rotate(' + Math.atan2(-(e.x - p.x), e.y - p.y) + 'rad)';
  }

  // ---------- pulling ----------
  function aim(e) {
    const rx = e.clientX - bx + offX - ax, ry = e.clientY - by + offY - ay, d = Math.hypot(rx, ry) || 1;
    pull = Math.max(0, d - LENGTH); stretchT = Math.min(pull, MAX_PULL);
    const k = d > LENGTH ? (LENGTH + stretchT) / d : 1;
    ex = ax + rx * k; ey = Math.max(ay + ry * k, ay + LENGTH * .25);
  }
  function tug() { stretch = 26; for (let i = N - 3; i <= N; i++) pts[i].py = pts[i].y - 6; toggle(); start(); }

  function bind() {
    h.addEventListener('pointerdown', e => {
      if (e.button > 0) return;
      e.preventDefault(); h.setPointerCapture(e.pointerId);
      const r = box.getBoundingClientRect(); bx = r.left; by = r.top;
      offX = pts[N].x - (e.clientX - bx); offY = pts[N].y - (e.clientY - by);
      drag = true; fired = didFire = false; moved = 0; sx = e.clientX; sy = e.clientY; t0 = performance.now();
      aim(e); start();
    });
    h.addEventListener('pointermove', e => {
      if (!drag) return;
      if (e.pointerType === 'mouse' && e.buttons === 0) { up(e); return; }
      aim(e); moved = Math.max(moved, Math.hypot(e.clientX - sx, e.clientY - sy));
      if (!fired && pull >= TRIGGER) { fired = didFire = true; toggle(); }
      else if (fired && pull < TRIGGER * .5) fired = false;
      start();
    });
    const up = e => {
      if (!drag) return;
      drag = false; fired = false;
      if (e.type === 'pointerup' && !didFire && moved < 6 && performance.now() - t0 < 400) tug();
      start();
    };
    h.addEventListener('pointerup', up);
    h.addEventListener('pointercancel', up);
    h.addEventListener('lostpointercapture', up);
    addEventListener('blur', up);
    h.addEventListener('click', e => { if (e.detail === 0) tug(); });
  }
})();
</script>

<!-- 3) PAGE TRANSITION -->
<!-- Paste this section below the custom cursor and light-switch code. -->
<style>
  #pt { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 2147482500; pointer-events: auto; touch-action: none; }
  html.cc-dark #pt { filter: invert(1) hue-rotate(180deg); }
</style>

<script>
(function () {
  'use strict';
  if (window.__pt) return;
  window.__pt = 1;

  /* ---------- settings ---------- */
  const CELL = 22;
  const GO_MS = 650;
  const HOLD_MS = 120;
  const ARRIVE_WAIT = 350;
  const ARRIVE_MS = 700;
  const COLORS = ['#e91b40', '#111111', '#e8a64e', '#78f0c8', '#e0407f', '#62b8f0'];
  const PAPER = '#f0f0f2';
  /* ------------------------------- */

  const KEY = 'lh-arrive';
  const root = document.documentElement;
  const rnd = Math.random, pick = a => a[Math.floor(rnd() * a.length)];
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const hash = (a, b, s) => { const v = Math.sin(a * 127.1 + b * 311.7 + s * 74.7) * 43758.5453; return v - Math.floor(v); };
  const sm = document.createElement('canvas'), smx = sm.getContext('2d');
  let cv = null, cx = null, vw = 0, vh = 0, busy = false;

  function mk() {
    cv = document.createElement('canvas'); cv.id = 'pt';
    vw = innerWidth; vh = innerHeight; cv.width = vw; cv.height = vh;
    cx = cv.getContext('2d');
    root.appendChild(cv);
  }
  function kill() { if (cv) { cv.remove(); cv = null; } busy = false; }
  function load(src, cb) {
    if (!src) return cb(null);
    const i = new Image();
    i.onload = () => cb(i); i.onerror = () => cb(null); i.src = src;
  }

  // The picture is drawn tiny and stretched up: pixelated and cropped like "cover".
  function drawPix(img, col, x, y, w, h, ps) {
    if (w < 1 || h < 1) return;
    const cw = Math.max(1, Math.round(w / ps)), ch = Math.max(1, Math.round(h / ps));
    sm.width = cw; sm.height = ch;
    if (img && img.naturalWidth) {
      const iw = img.naturalWidth, ih = img.naturalHeight, ar = w / h;
      let sw = iw, sh = iw / ar;
      if (sh > ih) { sh = ih; sw = ih * ar; }
      smx.imageSmoothingQuality = 'high';
      smx.drawImage(img, (iw - sw) / 2, (ih - sh) / 2, sw, sh, 0, 0, cw, ch);
    } else { smx.fillStyle = col || PAPER; smx.fillRect(0, 0, cw, ch); }
    cx.imageSmoothingEnabled = false;
    cx.drawImage(sm, 0, 0, cw, ch, x, y, w, h);
  }

  // ---------- leaving: the project picture grows to cover the screen ----------
  function go(url, src, col, r) {
    let target;
    try { target = new URL(url, location.href); } catch (_) { return; }
    if (!/^https?:$/.test(target.protocol)) return;
    busy = true; mk();
    let img = null;
    load(src, i => { img = i; });
    const t0 = performance.now();
    function frame(now) {
      const t = clamp((now - t0) / GO_MS, 0, 1), e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const x = r.x * (1 - e), y = r.y * (1 - e), w = r.w + (vw - r.w) * e, h = r.h + (vh - r.h) * e;
      cx.clearRect(0, 0, vw, vh);
      const A = Math.sin(Math.PI * t), q = Math.floor(now / 90);
      if (A > .05) {
        for (let i = 0, n = Math.ceil(w / CELL); i < n; i++) {
          if (hash(i, 1, q) < .4 * A) { cx.fillStyle = COLORS[Math.floor(hash(i, 2, q) * COLORS.length)]; cx.fillRect(x + i * CELL, y - CELL * (1 + Math.floor(hash(i, 3, q) * 2)), CELL, CELL); }
          if (hash(i, 4, q) < .4 * A) { cx.fillStyle = COLORS[Math.floor(hash(i, 5, q) * COLORS.length)]; cx.fillRect(x + i * CELL, y + h + CELL * Math.floor(hash(i, 6, q) * 2), CELL, CELL); }
        }
        for (let j = 0, n = Math.ceil(h / CELL); j < n; j++) {
          if (hash(j, 7, q) < .4 * A) { cx.fillStyle = COLORS[Math.floor(hash(j, 8, q) * COLORS.length)]; cx.fillRect(x - CELL * (1 + Math.floor(hash(j, 9, q) * 2)), y + j * CELL, CELL, CELL); }
          if (hash(j, 10, q) < .4 * A) { cx.fillStyle = COLORS[Math.floor(hash(j, 11, q) * COLORS.length)]; cx.fillRect(x + w + CELL * Math.floor(hash(j, 12, q) * 2), y + j * CELL, CELL, CELL); }
        }
        for (let b = 0; b < 3; b++) {
          const bh = CELL * .6, by = y + hash(b, 13, q) * Math.max(1, h - bh), bl = CELL * (3 + Math.floor(hash(b, 14, q) * 6));
          cx.fillStyle = COLORS[Math.floor(hash(b, 15, q) * COLORS.length)]; cx.globalAlpha = A;
          cx.fillRect(hash(b, 16, q) < .5 ? x - bl : x + w, by, bl, bh); cx.globalAlpha = 1;
        }
      }
      drawPix(img, col, x, y, w, h, 2 + (CELL - 2) * smooth(0, .35, t));
      if (t < 1) requestAnimationFrame(frame); else done();
    }
    function done() {
      cx.clearRect(0, 0, vw, vh);
      drawPix(img, col, 0, 0, vw, vh, CELL);
      try { sessionStorage.setItem(KEY, JSON.stringify({ src: src, col: col, t: Date.now() })); } catch (_) {}
      setTimeout(() => { location.href = target.href; }, HOLD_MS);
      setTimeout(() => { if (cv) dissolve(); }, 4000);
    }
    requestAnimationFrame(frame);
  }

  // ---------- arriving: the cover dissolves block by block ----------
  function dissolve() {
    const cols = Math.ceil(vw / CELL), rows = Math.ceil(vh / CELL), n = cols * rows, key = new Float32Array(n), idx = new Array(n);
    for (let i = 0; i < n; i++) { const x = i % cols, y = (i / cols) | 0; key[i] = hash(x, y, 7) * .7 + (x / cols + y / rows) * .15; idx[i] = i; }
    idx.sort((a, b) => key[a] - key[b]);
    const t0 = performance.now(); let pc = 0, pf = 0;
    function frame(now) {
      const t = clamp((now - t0) / ARRIVE_MS, 0, 1), e = t * t * (3 - 2 * t);
      const toF = Math.floor(e * n), toC = Math.floor(clamp(e - .12, 0, 1) * n);
      for (; pf < toF; pf++) {
        if (rnd() < .45) { const i = idx[pf]; cx.fillStyle = pick(COLORS); cx.fillRect((i % cols) * CELL, ((i / cols) | 0) * CELL, CELL, CELL); }
      }
      for (; pc < toC; pc++) { const i = idx[pc]; cx.clearRect((i % cols) * CELL, ((i / cols) | 0) * CELL, CELL, CELL); }
      if (t < 1) requestAnimationFrame(frame); else kill();
    }
    requestAnimationFrame(frame);
  }

  // ---------- arriving: the next page starts covered by the same picture ----------
  (function arrive() {
    let d = null;
    try { d = JSON.parse(sessionStorage.getItem(KEY)); sessionStorage.removeItem(KEY); } catch (_) {}

  })();

  // ---------- a project widget asks for the transition ----------
  addEventListener('message', e => {
    const d = e.data;
    if (!d || d.type !== 'page-go' || busy || !d.rect || !d.url) return;
    let f = null;
    for (const fr of document.getElementsByTagName('iframe')) if (fr.contentWindow === e.source) { f = fr; break; }

  addEventListener('pageshow', e => { if (e.persisted) kill(); });

    prepCv(c);
    const cx = c.cx, w = c.w, h = c.ih, cc = w / c.cw, cr = h / c.ch;
    const pos = prog * (LEVELS - 1), i0 = Math.floor(pos), i1 = Math.min(LEVELS - 1, i0 + 1), f = pos - i0;
    const psOf = i => Math.max(1.5, PIX_TO * Math.pow(CARD_END / PIX_TO, i / (LEVELS - 1)) * U);
    const tt = (1 + BAND) * Math.max(0, 1 - prog / .8);
    drawLevel(c, psOf(i0), 1, tt);
    if (f > .001 && i1 !== i0) drawLevel(c, psOf(i1), f, tt);
    const m = MOSH * Math.pow(1 - prog, .8), fade = clamp((1 - prog) * 1.6, 0, 1);
    if (m > .02) {
      const M = c.mosh;
      M.items = M.items.filter(b => now - b.born < b.life);
      if (M.items.length < Math.round(7 * m) && rnd() < .4) M.items.push(newMosh(c, now));
      M.items.forEach(b => {
        const age = (now - b.born) / b.life, env = smooth(0, .22, age) * (1 - smooth(.72, 1, age)), a = env * fade;
        if (a < .01) return;
        cx.globalAlpha = a;
        if (b.type === 0) {
          const bw = b.wc * cc, bh = b.hc * cr, sx = b.u * Math.max(0, w - bw), sy = b.v * Math.max(0, h - bh);
          cx.drawImage(c.cv, sx * K, sy * K, bw * K, bh * K, sx + b.dx * cc * env, sy, bw, bh);
        } else if (b.type === 1) {
          const bl = b.len * cc, bh = b.hh * cr, x = b.u * Math.max(0, w - bl) + b.slide * age * w * .3, y = b.v * Math.max(0, h - bh);
          if (b.smear) cx.drawImage(c.cv, Math.max(0, x) * K, y * K, Math.max(1, cc * .5) * K, bh * K, x, y, bl, bh);
          else { cx.fillStyle = b.col; cx.fillRect(x, y, bl, bh); }

      cx.globalAlpha = 1;
    }
    for (const k in c.filled) {
      const e = c.filled[k];
      if (!e.kind) continue;
      drawTile(cx, c, e, (k % c.cw) * cc, ((k / c.cw) | 0) * cr, cc, cr, 1 - smooth(e.end - .14, e.end, prog));
    }
  }

  function buildProjects(now) {
    measure();
    const maxDie = Math.max.apply(null, letters.map(L => L.die));
    asm = { land: now + maxDie + VANISH_MS + FLY_MIN_MS };
    const resolveAt = asm.land + LAND_SPREAD_MS + 250;
    const placed = [];
    PROJECTS.forEach((p, i) => {
      const el = document.createElement('div');
      el.className = PIXEL_LOAD ? 'card pxl' : 'card';
      if (!PIXEL_LOAD) el.style.transition = 'opacity ' + CARD_FADE_MS + 'ms';
      const im = document.createElement('div');
      im.className = 'im'; im.style.backgroundColor = PLACEHOLDERS[i % PLACEHOLDERS.length];
      const url = p.image ? (/^(https?:|data:)/.test(p.image) ? p.image : IMAGE_BASE + p.image) : '';
      if (url) im.style.backgroundImage = 'url("' + url + '")';
      const cap = document.createElement('div');
      cap.className = 'cap'; cap.textContent = p.title || ''; cap.style.color = INK; cap.style.fontFamily = fontFor(p.nameFont || p.titleFont);
      const cv = document.createElement('canvas');
      cv.style.cssText = 'position:absolute;left:0;top:0;pointer-events:none;border-radius:4px;';
      const sm = document.createElement('canvas');
      el.appendChild(im); el.appendChild(cap); el.appendChild(cv); cardsEl.appendChild(el);

      const a0 = rnd() * 6.283;
      const c = { el: el, im: im, capEl: cap, cv: cv, cx: cv.getContext('2d'), sm: sm, smx: sm.getContext('2d'), img: null, col: PLACEHOLDERS[i % PLACEHOLDERS.length],
        url: url, pxOn: PIXEL_LOAD, pnext: 0, show: false, dirty: false, filled: {}, cw: 1, ch: 1, seed: rnd() * 1000, mosh: { items: [] },
        bw: p.size || CARD_SIZE, ratio: p.ratio || CARD_RATIO, autoRatio: !p.ratio, w: 0, h: 0, ih: 0, x: W / 2, y: H / 2,
        vx: Math.cos(a0) * DRIFT_SPEED * U, vy: Math.sin(a0) * DRIFT_SPEED * U, m: 1, drag: false, pid: -1, tx: 0, ty: 0, ph: rnd() * 6.28, ph2: rnd() * 6.28, rot: 0, rx: 0, ry: 0,
        t: (PIXEL_LOAD ? resolveAt : now + maxDie + VANISH_MS * .5) + i * 120,
        p: p, moved: 0, sx: 0, sy: 0, ox: 0, oy: 0, td: 0, pin: false, gx: 0, gy: 0 };
      sizeCard(c);
      if (url) { const img = new Image(); img.onload = () => { c.img = img; if (c.autoRatio && img.naturalWidth && img.naturalHeight) { c.ratio = img.naturalHeight / img.naturalWidth; sizeCard(c); } c.dirty = true; }; img.src = url; }

      const cs = Math.max(1, PIX_TO * U);
      c.cw = Math.max(1, Math.round(c.w / cs)); c.ch = Math.max(1, Math.round(c.ih / cs));
      if (PIXEL_LOAD) for (let y = 0; y < c.ch; y++) for (let x = 0; x < c.cw; x++) cellList.push({ c: c, x: x, y: y });

      let best = null, bs = 1e18;
      for (let n = 0; n < 80; n++) {
        const x = c.w / 2 + 12 + rnd() * Math.max(1, W - c.w - 24), y = c.h / 2 + 12 + rnd() * Math.max(1, H - c.h - 24);
        let ov = 0, md = 1e9;
        placed.forEach(o => {
          const ox = Math.max(0, (c.w + o.w) / 2 + 12 - Math.abs(x - o.x)), oy = Math.max(0, (c.h + o.h) / 2 + 12 - Math.abs(y - o.y));
          ov += ox * oy; md = Math.min(md, Math.hypot(x - o.x, y - o.y));
        });
        const sc = ov * 1000 - md;
        if (sc < bs) { bs = sc; best = { x: x, y: y }; }
      }
      c.x = best.x; c.y = best.y; placed.push(c);
      cards.push(c);

      el.addEventListener('pointerenter', () => { if (!c.pxOn && c.show && p.title) { cap.__b = fontFor(p.nameFont || p.titleFont); glitchText(cap, p.title, HOVER_SWAP_MS); } });
      const drop = e => {
        if (!c.drag || (e && e.pointerId !== c.pid)) return;
        c.drag = false; c.pid = -1; el.classList.remove('drag');
        if (e && e.type === 'pointerup' && c.moved < 8 && performance.now() - c.td < 400) { openProject(c); }
        else { const vm = MAX_SPEED * U; c.vx = clamp(c.vx * THROW, -vm, vm); c.vy = clamp(c.vy * THROW, -vm, vm); }
      };
      el.addEventListener('pointerdown', e => {
        if (c.pxOn || !c.show || c.drag || e.button !== 0 || e.ctrlKey || !e.isPrimary) return;
        e.preventDefault();
        try { el.setPointerCapture(e.pointerId); } catch (_) {}
        c.pid = e.pointerId; c.drag = true; c.moved = 0; c.td = performance.now(); c.sx = e.clientX; c.sy = e.clientY;
        c.ox = c.x - e.clientX; c.oy = c.y - e.clientY; c.tx = c.x; c.ty = c.y;
        el.style.zIndex = ++zTop; el.classList.add('drag');
      });
      el.addEventListener('pointermove', e => {
        if (!c.drag || e.pointerId !== c.pid) return;
        if (e.pointerType === 'mouse' && e.buttons === 0) { drop(); return; }
        c.tx = e.clientX + c.ox; c.ty = e.clientY + c.oy;
        c.moved = Math.max(c.moved, Math.hypot(e.clientX - c.sx, e.clientY - c.sy));
        if (c.moved > 8) c.pin = false;      // a real drag frees it, a plain click (opens the project) doesn't
        
      });
      el.addEventListener('pointerup', drop);
      el.addEventListener('pointercancel', drop);
      el.addEventListener('lostpointercapture', drop);
    });
    addEventListener('blur', () => cards.forEach(c => { if (c.drag) { c.drag = false; c.pid = -1; c.el.classList.remove('drag'); } }));
    for (let i = cellList.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)), t = cellList[i]; cellList[i] = cellList[j]; cellList[j] = t; }
    asm.total = Math.ceil(cellList.length * PARTICLE_MULT);
    letters.forEach(L => { L.budget = Math.ceil(asm.total / letters.length); });

    const tb = document.createElement('button');
    tb.id = 'tidy'; tb.type = 'button'; tb.textContent = 'tidy up';
    tb.style.fontFamily = fam(primary);
    tb.style.setProperty('--tb-ink', INK); tb.style.setProperty('--tb-bg', BG || '#f0f0f2');
    tb.addEventListener('click', () => { glitchText(tb, 'tidy up', 420); tidyUp(); });
    stage.appendChild(tb);
    const lastT = Math.max.apply(null, cards.map(c => c.t)); // fade in after the last card finishes building
    setTimeout(() => tb.classList.add('in'), Math.max(0, lastT + (PIXEL_LOAD ? CARD_PIX_MS : CARD_FADE_MS) - performance.now()));
  }

  function physics(now, dt) {
    const vmax = MAX_SPEED * U, shove = SHOVE * U;
    cards.forEach(c => {
      if (c.pxOn) {
        if (now >= c.t) { c.show = true; cardPix(c, now); }
        else if (c.dirty) drawBuild(c, now);
      }
      if (c.drag) {
        const ox = c.x, oy = c.y;

      if (c.x > W - c.w / 2) { c.x = W - c.w / 2; c.vx = -Math.abs(c.vx) * WALL_BOUNCE; }
      if (c.y < c.h / 2) { c.y = c.h / 2; c.vy = Math.abs(c.vy) * WALL_BOUNCE; }
      if (c.y > H - c.h / 2) { c.y = H - c.h / 2; c.vy = -Math.abs(c.vy) * WALL_BOUNCE; }
    });
    for (let it = 0; it < 2; it++) for (let i = 0; i < cards.length; i++) for (let j = i + 1; j < cards.length; j++) {
      const a = cards[i], b = cards[j];
      if (a.drag && b.drag) continue;
      if (a.pin && b.pin) continue;
      const dx = b.x - a.x, dy = b.y - a.y, px = (a.w + b.w) / 2 - Math.abs(dx), py = (a.h + b.h) / 2 - Math.abs(dy);
      if (px <= 0 || py <= 0) continue;
      let nx = 0, ny = 0, pen;
      if (px < py) { nx = dx < 0 ? -1 : 1; pen = px; } else { ny = dy < 0 ? -1 : 1; pen = py; }
      pen = Math.min(pen, shove);
      if (a.drag || b.drag) {
  if (it) continue;

  const m = a.drag ? b : a;
  const k = a.drag ? 1 : -1;

  // Push the other card away from the dragged card
  m.x = clamp(m.x + nx * pen * k, m.w / 2, W - m.w / 2);
  m.y = clamp(m.y + ny * pen * k, m.h / 2, H - m.h / 2);

  // Release it from its tidy-up position so it can move freely
  m.pin = false;

  // Give it momentum from the collision
  m.vx += nx * pen * k * .35;
  m.vy += ny * pen * k * .35;

  continue;
      }
      const ia = 1 / a.m, ib = 1 / b.m, is = ia + ib;
      a.x -= nx * pen * ia / is; a.y -= ny * pen * ia / is; b.x += nx * pen * ib / is; b.y += ny * pen * ib / is;
      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rv < 0) {
        const jj = -(1 + BOUNCE) * rv / is;
        a.vx -= nx * jj * ia; a.vy -= ny * jj * ia; b.vx += nx * jj * ib; b.vy += ny * jj * ib;
      }

    const rng = TILT_RANGE * clamp(Math.min(W, H * 1.4) / 900, .3, 1.6);
    cards.forEach(c => {
      c.rot += (clamp(c.vx * 2.2, -14, 14) - c.rot) * .1 * dt;
      if (!PIXEL_LOAD && !c.show && now >= c.t) c.show = true;
      c.el.style.opacity = c.show ? 1 : 0;
      let trx = 0, tryy = 0;
      if (TILT > 0 && !c.pxOn && !c.drag && mx > -1e3) {
        const dx = mx - c.x, dy = my - c.y, near = clamp(1 - Math.hypot(dx, dy) / rng, 0, 1);

    });
  }
})();

<script>
(function () {
  'use strict';
  if (parent === window || !matchMedia('(hover:hover) and (pointer:fine)').matches) return;

  /* ---------- edit these per widget ---------- */
  const RULES = [                    // [css selector, cursor state] - first match wins
    ['#tidy', 'finger'],
    ['#menu', 'finger'],
    ['.pj-m.bk canvas.on-page', 'hover'],
    ['.pj-m', 'finger'],
    ['.lb', 'hover'],
    ['.card', 'hover']
  ];
  const GRAB = '.card.drag, .pj-m.bk.grab';
  const CLICKABLE = 'a,button,input,select,textarea,label,summary,[role=button],[role=link],[onclick]';
  const PRESERVE = ['.card .im', '.card canvas', '.pj-m img', '.pj-m canvas', '.pj-cover', '.lb-img'];
  /* ------------------------------------------- */

  const DEBUG = false;

  let x = 0, y = 0, target = null, queued = false, key = '', down = false;

  let dot = null;
  if (DEBUG) {
    dot = document.createElement('div');
    dot.style.cssText = 'position:fixed;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#f0f;pointer-events:none;z-index:2147483647';
    document.documentElement.appendChild(dot);
  }

  function stateOf(t) {
    if (down || document.querySelector(GRAB)) return 'grab';
    if (!t || t.nodeType !== 1) return 'pointer';
    for (const r of RULES) if (t.closest(r[0])) return r[1];
    return t.closest(CLICKABLE) ? 'finger' : 'pointer';
  }

  function send() {
    queued = false;
    const state = stateOf(target), k = x + ',' + y + ',' + state;
    if (k === key) return;
    key = k;
    parent.postMessage({ type: 'cursor-sync', x: x, y: y, state: state }, '*');
  }
  const queue = () => { if (!queued) { queued = true; requestAnimationFrame(send); } };

  const opt = { capture: true, passive: true };
  const track = e => {
    if (e.pointerType === 'touch') return;
    if (e.type === 'pointerdown') down = true;
    else if (e.type === 'pointerup' || e.type === 'pointercancel') down = false;
    else down = e.buttons > 0;
    x = e.clientX; y = e.clientY; target = e.target;
    if (dot) dot.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    queue();
  };
  addEventListener('pointermove', track, opt);
  addEventListener('pointerdown', track, opt);
  addEventListener('pointerup', track, opt);
  addEventListener('pointercancel', track, opt);
  addEventListener('blur', () => { down = false; queue(); }, opt);
  document.documentElement.addEventListener('pointerleave', () => {
    key = ''; parent.postMessage({ type: 'cursor-sync', hide: true }, '*');
  });

  function addStyle(id, css) {
    if (document.getElementById(id)) return;
    const s = document.createElement('style');
    s.id = id; s.textContent = css;
    document.head.appendChild(s);
  }
  addEventListener('message', e => {
    const d = e.data;
    if (e.source !== parent || !d) return;
    if (d.type === 'cursor-ready') addStyle('cc-hide', 'html,html *{cursor:none!important}');
    else if (d.type === 'cc-theme') {
      addStyle('cc-theme-css', PRESERVE.map(s => 'html.cc-dark ' + s).join(',') + '{filter:invert(1) hue-rotate(180deg)}');
      document.documentElement.classList.toggle('cc-dark', !!d.dark);
    }
  });
  parent.postMessage({ type: 'cc-hello' }, '*');
})();
</script>
